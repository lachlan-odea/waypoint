<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__LER_TITLE__</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --brand1:#1D1765; --brand2:#2f6fed;
  --bg:#f3f4fa; --card:#ffffff; --text:#14123a; --muted:#5d6184; --line:#dcdeee;
  --accent:#1D1765; --accent2:#2f6fed; --accent-soft:#e8e9f7; --ok:#12915a; --ok-soft:#e1f6ec;
  --no:#d6334a; --no-soft:#fde7ea; --warn:#b26a00; --warn-soft:#fff2d9;
  --shadow:0 8px 30px rgba(29,23,101,.12);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d0c25; --card:#171637; --text:#eeeefc; --muted:#a2a5c9; --line:#2c2c58;
    --accent:#a5a3f7; --accent2:#6b9bff; --accent-soft:#25244f; --ok:#4ad69a; --ok-soft:#173a2c;
    --no:#ff7a8d; --no-soft:#3d1c24; --warn:#ffc15e; --warn-soft:#3a2d12;
    --shadow:0 8px 30px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;line-height:1.45;min-height:100vh}
.hero{background:linear-gradient(135deg,var(--brand1),var(--brand2));color:#fff;padding:28px 20px 70px}
.hero-in{max-width:760px;margin:0 auto}
.live{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,255,255,.2);padding:6px 12px;border-radius:99px}
.dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.5)}}
h1{margin:14px 0 6px;font-size:clamp(26px,5vw,38px);line-height:1.1}
.hero p{margin:0;opacity:.92;max-width:520px}
.wrap{max-width:760px;margin:-46px auto 40px;padding:0 16px}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:26px;border:1px solid var(--line)}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:6px}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand1),var(--brand2));transition:width .35s}
.step-label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:18px}
h2{margin:0 0 4px;font-size:24px}
.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;color:var(--text);font:inherit;transition:.15s}
.opt:hover{border-color:var(--accent);transform:translateY(-2px)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt:not(:has(.ic)){justify-content:center;text-align:center;padding:22px 16px}
.opt:not(:has(.ic)) b{font-size:18px}
.opt .ic{font-size:26px;line-height:1;flex-shrink:0}
.micimg{display:block;width:84px;height:63px;background:var(--accent);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain}
.opt b{display:block;font-size:16px}
.opt span.d{display:block;font-size:13px;color:var(--muted);margin-top:2px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px}
.btn{border:0;border-radius:12px;padding:13px 22px;font:inherit;font-weight:700;cursor:pointer;transition:.15s;text-decoration:none;display:inline-block}
.btn.p{background:linear-gradient(90deg,var(--brand1),var(--brand2));color:#fff}
.btn.p:hover{filter:brightness(1.08)}
.btn.p:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.g{background:transparent;color:var(--muted)}
.btn.o{background:var(--accent-soft);color:var(--accent)}
.err{color:var(--no);font-size:13px;margin-top:8px;min-height:18px}
.sum{display:grid;gap:8px;margin:6px 0 4px}
.sum div{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.sum div span:first-child{color:var(--muted)}
.sum div span:last-child{font-weight:600;text-align:right}
.sumh{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:800;padding:14px 0 4px;border-bottom:2px solid var(--line)!important;display:block!important}
.done{text-align:center;padding:10px 0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.num{border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:14px 0;font:inherit;font-weight:700;font-size:18px;cursor:pointer;transition:.15s}
.num:hover{border-color:var(--accent)}
.num.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.person{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:center;margin-top:10px}
.person>span{font-size:13px;font-weight:600;color:var(--muted)}
.pcard{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px;background:var(--bg)}
.pcard input[type=text]{margin-top:8px;background:var(--card)}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;font-size:13px;margin-top:10px}
.chk input{width:auto}
.subhead{margin:20px 0 0;font-weight:700;font-size:14px}
.callout{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px;margin-top:14px;line-height:1.5}
.callout a{color:var(--accent);font-weight:600}
.callout.warn{background:var(--warn-soft)}
.yn{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
.res{border:1px solid var(--line);border-left:5px solid var(--brand2);border-radius:10px;padding:14px 16px;margin-top:14px;background:var(--card)}
.res .d{color:var(--muted);font-size:14px;margin-top:2px}
.deadline{margin-top:12px;font-size:13px;background:var(--accent-soft);padding:8px 12px;border-radius:8px}
.stage{position:relative;border-radius:16px;overflow:hidden;color:#fff;text-align:center;background:#0b0a2c}
.stage-svg{position:absolute;inset:0;width:100%;height:100%}
.stage-in{position:relative;padding:48px 20px 64px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.stage-in .big{font-size:52px;line-height:1}
.stage-in h2{color:#fff;margin:8px 0 6px}
.stage-in p{margin:0 auto;max-width:460px;opacity:.95}
.beam{transform-box:view-box;animation:sway 7s ease-in-out infinite alternate;opacity:.9}
.beam.b1{transform-origin:94px 10px}.beam.b2{transform-origin:506px 10px;animation-direction:alternate-reverse}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.beam,.dot{animation:none}}
.ref{display:inline-block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:var(--accent-soft);color:var(--accent);padding:4px 10px;border-radius:8px;margin-top:8px}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:50;padding:14px 22px;border-radius:14px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:92vw;text-align:center;background:var(--no);color:#fff}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

function sections(r){
  var contact = r.primaryContact==="No" ? "No. Primary event contact: "+(r.contactName||"-")+(r.contactEmail?" ("+r.contactEmail+")":"") : (r.primaryContact||"");
  var spk = r.speakers?(r.speakers+(speakerList(r).length?": "+speakerList(r).join(", "):"")):"";
  var modv = r.moderation==="Requester's team" ? "Requester's team"+(r.modName?": "+r.modName+" (to be added as a Producer)":"") : (r.moderation||"");
  return [
    ["Requester",[["Name",r.name],["Email",r.email],["Team",r.team],["Primary event contact",contact]]],
    ["Event",[["Date",dateStr(r)],["Time",timeRange(r)],["In-person attendees",r.inPerson],["Online attendees",r.online],["Who's watching online",r.onlineWho]]],
    ["Venue & access",[["Audience type",r.audienceType],["Room",r.room],["Access",ACCESS[r.access]||r.access],["Online platform",r.teamsConfirm?"Microsoft Teams (confirmed by requester). The Live-Events Team will recommend the best platform/event type.":""]]],
    ["Presenters & audio",[["In-person speakers",spk],["Mics",r.mics],["On-screen speaker timer",r.timer]]],
    ["Content",[["Includes",r.content],["Pre-recorded segments",namesOf(r)],["Pre-recording support",r.preSupport?"Requested. The Live Events Team will be in touch (Riverside suggested).":""],["Dial-in needed",r.dialIn],["Slide control",r.slideControl],["Script / speaker notes in PowerPoint",r.script]]],
    ["Q&A",[["Format",r.qa],["Online Q&A",r.qaMod],["Moderator",modv]]],
    ["Recording & delivery",[["Deliverables",deliverLines(r)],["On-demand needed by",wantsOnDemand(r)?(r.publishTbc?"Not sure yet":(r.publishWhen?dateStr({date:r.publishWhen}):"")):""],["On-demand published to",wantsOnDemand(r)?(r.publishWhere||[]):[]]]],
    ["Facilities",[["Facilities request",r.facilitiesAck?"Acknowledged: will contact "+FACILITIES_EMAIL+" for additional support (catering, security, furniture hire, seating, branded banners or decorations)":""]]],
    ["Notes",[["Notes",r.notes]]]
  ];
}
function keepRow(kv){ var v=kv[1]; return Array.isArray(v)?v.length>0:!!v; }
function lines(r){
  var out=["LIVE EVENT REQUEST: "+r.eventName];
  sections(r).forEach(function(sec){
    var rr=sec[1].filter(keepRow); if(!rr.length) return;
    out.push("","--- "+sec[0].toUpperCase()+" ---");
    rr.forEach(function(kv){ out.push(kv[0]+": "+(Array.isArray(kv[1])?kv[1].join("; "):kv[1])); });
  });
  if(r.reference) out.push("","Reference: "+r.reference);
  return out.join("\n");
}
function mailBrief(r){ return "mailto:"+LIVE_EVENTS_EMAIL+"?subject="+encodeURIComponent("Live event request: "+r.eventName)+"&body="+encodeURIComponent(lines(r)); }
function outlookLink(r){ return "https://outlook.office.com/mail/deeplink/compose?to="+encodeURIComponent(LIVE_EVENTS_EMAIL)+"&subject="+encodeURIComponent("Live event request: "+r.eventName)+"&body="+encodeURIComponent(lines(r)); }

function flags(r){
  var f = [];
  if(r.dateTbc||r.timeTbc||r.endTbc) f.push("Date or time not confirmed yet");
  if(r.dateUnc&&!r.dateTbc) f.push("Date is not confirmed and may change");
  if(r.audienceType===AT.out) f.push("Not hosted in Sydney: our on-site support is Sydney only, so we need to work with the requester on a solution");
  if(externalOnline(r) && r.access==="Public") f.push("External online audience with public access");
  if(((Number(r.inPerson)||0)+(Number(r.online)||0))>=500 && r.qaMod==="Not moderated") f.push("Large audience with unmoderated online Q&A");
  if(r.moderation==="Live Events Team") f.push("Needs a Q&A moderator from the Live Events Team");
  if(r.moderation==="Requester's team" && r.modName) f.push("Add "+r.modName+" to the event as a Producer (Q&A moderator)");
  if(Array.isArray(r.preSpeakers)&&r.preSpeakers.some(function(p){return p.unconfirmed;})) f.push("Unconfirmed pre-recorded speaker(s)");
  if(r.preSupport) f.push("Needs support with pre-recording: get in touch (Riverside suggested)");
  if(r.dialIn==="Yes") f.push("Dial-in needed: remote person joining live");
  if(r.slideControl==="We run the slides for you") f.push("We run the slides: collect decks in advance");
  if(r.slideControl==="Speakers control their own slides") f.push("Supply a USB slide remote");
  if(r.script==="Yes") f.push("Script or speaker notes are included in the PowerPoint");
  if(r.timer==="Yes") f.push("On-screen speaker timer required");
  if(wantsOnDemand(r) && has(r.publishWhere,"Supplied back to attendees for rewatching")) f.push("Recording to be supplied to attendees: internal sharing or an unlisted public link only, no private lists and no downloads");
  return f;
}

      if(!a.primaryContact) return bad("Please say whether you are the primary event contact.");
      if(a.primaryContact==="No"&&!a.contactName) return bad("Please enter the primary event contact's name.");
      if(a.contactEmail&&!/^\S+@\S+\.\S+$/.test(a.contactEmail)) return bad("The primary contact's email doesn't look right.");
      if(!a.eventName) return bad("Please enter the event name.");
      if((!a.date&&!a.dateTbc)||(!a.time&&!a.timeTbc)||(!a.endTime&&!a.endTbc)) return bad("Please choose the date and times, or tick 'not sure yet'.");
      if(!a.timeTbc&&!a.endTbc&&a.endTime<=a.time) return bad("End time must be after the start time.");
      if(a.inPerson===""&&a.online==="") return bad("Please enter how many in person and/or online attendees you expect.");
      if(Number(a.online)>0&&!a.onlineWho) return bad("Please say who is watching the online stream.");
    } else if(key==="audience"){
      if(!a.audienceType) return bad("Pick an audience type to continue.");
      if(hostedSydney(a)&&!a.room) return bad("Pick the room you would like.");
    } else if(key==="presenters"){
      if(!a.speakers) return bad("Pick how many in person speakers are presenting.");
      if(!a.mics.length) return bad("Pick at least one mic option.");
    } else if(key==="content"){
      if(!a.content.length) return bad("Pick at least one option (or 'None of these').");
    } else if(key==="prerec"){
      if(!a.preCount) return bad("Pick how many people need to be pre-recorded.");
      if((a.preSpeakers||[]).some(function(p){return (!p.name&&!p.unconfirmed)||(!p.based&&!p.unconfirmed);})) return bad("For each person, enter a full name and where they're based (or tick Unconfirmed speaker).");
    } else if(key==="slides"){
      if(!a.slideControl) return bad("Pick who controls the slides.");
      if(!a.script) return bad("Please say whether a script or speaker notes are included.");
    } else if(key==="moderation"){
      if(!a.moderation) return bad("Pick who moderates the Q&A.");
      if(a.moderation==="Requester's team"&&!a.modName) return bad("Enter the name of the moderator from your team.");
    } else if(key==="extras"){
      if(onlineInvolved(a)&&!a.teamsConfirm) return bad("Please tick to confirm the online platform.");
      if(!a.timer) return bad("Please say whether you need an on-screen speaker timer.");
    } else if(key==="deliverables"){
      if(!a.deliverables) return bad("Pick what you need delivered.");
      if(wantsOnDemand(a)){
        if(!a.publishWhen&&!a.publishTbc) return bad("Please say when the on-demand recording is needed, or tick 'not sure yet'.");
        if(!a.publishWhere.length) return bad("Pick where the recording is being published.");
      }
    } else if(key==="facilities"){
      if(!a.facilitiesAck) return bad("Please tick to confirm you understand.");
    } else if(key!=="review" && key!=="resources" && !a[key]){ return bad("Pick an option to continue."); }
    errMsg="";
    if(key==="review") return submit();
    step++; render();
  };
  saveDraft();
}
function saveInputs(){
  ["name","email","team","contactName","contactEmail","eventName","date","time","endTime","notes","inPerson","online","modName","publishWhen"].forEach(function(k){ var e=$("#f-"+k); if(e) a[k]=e.value.trim(); });
  ["dateTbc","timeTbc","endTbc","dateUnc","teamsConfirm","facilitiesAck","publishTbc","preSupport"].forEach(function(k){ var e=$("#f-"+k); if(e) a[k]=e.checked; });
  Array.prototype.forEach.call(document.querySelectorAll("[data-sp]"),function(e){ if(!Array.isArray(a.speakerNames)) a.speakerNames=[]; a.speakerNames[+e.getAttribute("data-sp")]=e.value.trim(); });
  Array.prototype.forEach.call(document.querySelectorAll("[data-ps]"),function(e){
    var pp=(a.preSpeakers||[])[+e.getAttribute("data-ps")]; if(!pp) return;
    if(e.getAttribute("data-f")==="unconfirmed") pp.unconfirmed=e.checked; else pp[e.getAttribute("data-f")]=e.value.trim();
  });
}

// Send the request: one document, created through Firestore's REST API.
// Every field is a string (the whole submission goes in `json`), which is
// all the rules accept from a form that isn't signed in.
function submit(){
  if(sending) return;
  var now = new Date().toISOString();
  var rec = Object.assign({}, a, {createdAt: now});
  var data = {
    json: JSON.stringify(rec),
    eventName: String(rec.eventName).slice(0,160),
    requesterName: String(rec.name).slice(0,80),
    requesterEmail: String(rec.email).slice(0,120),
    eventDate: rec.dateTbc ? "" : (rec.date||""),
    createdAt: now,
    status: "pending",
    intakeToken: INTAKE_TOKEN
  };
  var fields = {};
  Object.keys(data).forEach(function(k){ fields[k] = { stringValue: data[k] }; });
  sending = true; sendError = ""; render();
  fetch(SUBMIT_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ fields: fields })
  })
    .then(function(res){
      if(!res.ok) throw new Error("HTTP "+res.status);
      return res.json();
    })
    .then(function(doc){
      var name = (doc && doc.name) || "";
      rec.reference = name.slice(name.lastIndexOf("/")+1);
      sending = false;
      submitted = {rec: rec};
      clearDraft();
      render();
      window.scrollTo(0,0);
    })
    .catch(function(err){
      sending = false;
      sendError = (err && /HTTP 403/.test(err.message))
        ? "This copy of the form has been retired, so the request couldn't be sent."
        : "Couldn't send the request just now. Check you're online and try again.";
      render();
    });
}

function makePdf(r){
  var jsPDF=window.jspdf.jsPDF; var doc=new jsPDF({unit:"pt",format:"a4"});
  var W=595,H=842,M=40,CW=W-2*M,LX=M+8,VX=M+170;
  var P=[29,23,101],K=[47,111,237],SOFT=[233,234,247],INK=[20,18,58],MUT=[96,99,132],LINE=[220,222,238],AMB=[178,106,0],AMBS=[255,242,217];
  var fill=function(c){doc.setFillColor(c[0],c[1],c[2]);}, tc=function(c){doc.setTextColor(c[0],c[1],c[2]);}, dc=function(c){doc.setDrawColor(c[0],c[1],c[2]);};
  var dateNice=dateStr(r), timeNice=timeRange(r);
  var aud=AUD_SHORT[r.audienceType]||r.audienceType||"-";
  var delivShort=r.deliverables==="Both"?"Live stream + On-demand edit":(r.deliverables||"-");

  fill(P);doc.rect(0,0,W,128,"F");
  fill(K);doc.rect(0,128,W,6,"F");
  tc([255,255,255]);doc.setFont("helvetica","bold");doc.setFontSize(9);doc.text("LIVE EVENT REQUEST  |  LIVE EVENTS TEAM",M,38);
  var nm=doc.splitTextToSize(r.eventName||"Untitled event",470).slice(0,2);
  doc.setFontSize(24);doc.text(nm,M,nm.length>1?66:72);
  doc.setFont("helvetica","normal");doc.setFontSize(11);
  doc.text(doc.splitTextToSize(dateNice+"   |   "+timeNice+(r.room?"   |   "+r.room:""),W-2*M)[0],M,114);

  var y=158;
  var need=function(h){ if(y+h>H-60){ doc.addPage(); y=50; } };

  var tiles=[["IN PERSON",r.inPerson||"-"],["ONLINE",r.online||"-"],["AUDIENCE TYPE",aud],["DELIVERABLE",delivShort]];
  var tw=(CW-30)/4;
  tiles.forEach(function(t,i){
    var x=M+i*(tw+10);
    fill(SOFT);doc.roundedRect(x,y,tw,54,8,8,"F");
    fill(i%2?K:P);doc.roundedRect(x,y+10,3,34,1.5,1.5,"F");
    tc(MUT);doc.setFont("helvetica","bold");doc.setFontSize(7.5);doc.text(t[0],x+12,y+18);
    tc(INK);doc.setFontSize(11);doc.text(doc.splitTextToSize(String(t[1]),tw-20).slice(0,2),x+12,y+34);
  });
  y+=76;

  function section(title,color){
    need(48); fill(color||P);doc.roundedRect(M,y,4,16,2,2,"F");
    tc(INK);doc.setFont("helvetica","bold");doc.setFontSize(12.5);doc.text(title,M+12,y+12); y+=28;
  }
  function kv(label,val){
    var w=doc.splitTextToSize(String(val),CW-VX+M-8);
    need(w.length*14+12);
    tc(MUT);doc.setFont("helvetica","bold");doc.setFontSize(8);doc.text(doc.splitTextToSize(label.toUpperCase(),150).slice(0,2),LX,y+9);
    tc(INK);doc.setFont("helvetica","normal");doc.setFontSize(11);doc.text(w,VX,y+10);
    y+=Math.max(w.length*14,label.length>26?22:0)+8; dc(LINE);doc.setLineWidth(.6);doc.line(M,y-3,W-M,y-3);
  }

  sections(r).forEach(function(sec,i){
    var rr=sec[1].filter(keepRow); if(!rr.length) return;
    y+=8; section(sec[0],i%2?K:P);
    rr.forEach(function(x){ kv(x[0],Array.isArray(x[1])?x[1].join("\n"):x[1]); });
  });

  var fl=flags(r);
  if(fl.length){
    y+=8;
    var wl=fl.map(function(f){ return doc.splitTextToSize("- "+f,CW-36); });
    var hh=wl.reduce(function(n,w){ return n+w.length*14; },0)+44;
    need(hh+10);
    fill(AMBS);doc.roundedRect(M,y,CW,hh,10,10,"F");
    fill(AMB);doc.roundedRect(M,y+8,4,hh-16,2,2,"F");
    tc(AMB);doc.setFont("helvetica","bold");doc.setFontSize(9);doc.text("FOR THE LIVE EVENTS TEAM'S ATTENTION",M+18,y+22);
    doc.setFont("helvetica","normal");doc.setFontSize(10.5);
    var fy=y+40; wl.forEach(function(w){ doc.text(w,M+18,fy); fy+=w.length*14; });
    y+=hh+14;
  }

  var n=doc.getNumberOfPages();
  for(var i=1;i<=n;i++){
    doc.setPage(i);
    fill(K);doc.rect(0,H-6,W,6,"F");
    dc(LINE);doc.setLineWidth(.6);doc.line(M,H-40,W-M,H-40);
    tc(MUT);doc.setFont("helvetica","normal");doc.setFontSize(8.5);
    doc.text("Submitted "+new Date(r.createdAt).toLocaleString()+"   |   Sent to the Live Events Team"+(r.reference?"   |   Ref "+r.reference:""),M,H-24);
    doc.text("Page "+i+" of "+n,W-M,H-24,{align:"right"});
  }
  return doc.output("blob");
}
function downloadBlob(blob,filename){
  var url=URL.createObjectURL(blob); var el=document.createElement("a"); el.href=url; el.download=filename;
  document.body.appendChild(el); el.click(); el.remove(); setTimeout(function(){ URL.revokeObjectURL(url); },1000);
}
function savePdf(r){
  var base="Live Event Request - "+(r.eventName||"event").replace(/[^\w\- ]+/g,"").trim();
  try{
    if(window.jspdf){ downloadBlob(makePdf(r),base+".pdf"); }
    else { downloadBlob(new Blob([lines(r)],{type:"text/plain;charset=utf-8"}),base+".txt"); }
  }catch(e){ toast("Couldn't create the download.",4000); }
}
function stageSvg(){
  var folds=function(x0,dir){ return [8,22,36,50].map(function(d){ return '<path d="M'+(x0+dir*d)+' 0L'+(x0+dir*(d-6))+' 220" stroke="#2a050b" stroke-opacity=".45" stroke-width="3"/>'; }).join(""); };
  return '<svg class="stage-svg" viewBox="0 0 600 220" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'+
  '<defs>'+
    '<linearGradient id="stBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0a2c"/><stop offset="1" stop-color="#1D1765"/></linearGradient>'+
    '<linearGradient id="stBeam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".6"/><stop offset="1" stop-color="#9fc1ff" stop-opacity="0"/></linearGradient>'+
    '<radialGradient id="stFloor" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd9a0" stop-opacity=".9"/><stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/></radialGradient>'+
    '<linearGradient id="stCurt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#46090f"/><stop offset=".55" stop-color="#8d1526"/><stop offset="1" stop-color="#46090f"/></linearGradient>'+
  '</defs>'+
  '<rect width="600" height="220" fill="url(#stBg)"/>'+
  '<rect y="168" width="600" height="52" fill="#24160c" opacity=".6"/>'+
  '<g><polygon class="beam b1" points="94,10 6,205 300,205" fill="url(#stBeam)"/><polygon class="beam b2" points="506,10 300,205 594,205" fill="url(#stBeam)"/></g>'+
  '<ellipse cx="300" cy="192" rx="200" ry="26" fill="url(#stFloor)"/>'+
  '<path d="M0 0H72L60 220H0Z" fill="url(#stCurt)"/>'+folds(0,1)+
  '<path d="M600 0H528L540 220H600Z" fill="url(#stCurt)"/>'+folds(600,-1)+
  '<rect width="72" height="9" fill="#c9a23a"/><rect x="528" width="72" height="9" fill="#c9a23a"/>'+
  '<circle cx="94" cy="10" r="6" fill="#fff"/><circle cx="506" cy="10" r="6" fill="#fff"/>'+
  '</svg>';
}
function renderDone(){
  var rec = submitted.rec;
  $("#main").innerHTML = '<div class="stage">'+stageSvg()+'<div class="stage-in"><div class="big">🎉</div><h2>Request submitted!</h2>'+
  '<p>Thanks! It\'s with the Live Events Team, who\'ll review it and work out how best to support your event.</p></div></div>'+
  '<div class="done" style="padding-top:18px">'+
  (rec.reference?'<div class="ref">Reference '+esc(rec.reference)+'</div>':"")+
  '<p class="sub">Keep a copy for yourself, or email it to the team as well.</p>'+
  '<div class="actions" style="justify-content:center">'+
    '<button type="button" class="btn p" id="pdf">📄 Download a PDF of your request</button>'+
  '</div>'+
  '<div class="actions" style="justify-content:center">'+
    '<a class="btn o" target="_blank" rel="noopener" href="'+mailBrief(rec)+'">✉️ Email a copy via your email app</a>'+
    '<a class="btn o" target="_blank" rel="noopener" href="'+outlookLink(rec)+'">🌐 Email a copy via Outlook on the web</a>'+
  '</div>'+
  '<p class="note">Questions? Contact <b>'+esc(LIVE_EVENTS_EMAIL)+'</b>.</p>'+
  '<div class="actions" style="justify-content:center"><button type="button" class="btn g" id="again">Submit another request</button></div></div>';
  $("#pdf").onclick=function(){ savePdf(rec); };
  $("#again").onclick=function(){ var n=a.name,e=a.email,t=a.team; a=Object.assign(blank(),{name:n,email:e,team:t}); submitted=null; step=0; sendError=""; render(); window.scrollTo(0,0); };
}

loadDraft();
render();
})();
</script>
