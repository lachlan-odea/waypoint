<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>__CAMPAIGN_TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap" />
<style>
  :root {
    /* CargoWise brand palette. */
    --navy: #1d1765;
    --blue: #371ee1;
    --violet: #b7b3ff;
    --mint: #c6ffd1;
    --highlighter: #eafc88;
    --peach: #ffbe98;
    --cherry: #651d32;
    --pine: #244349;
    --midnight: #141e30;

    --page: #f6f6fb;
    --surface: #ffffff;
    --rule: #e2e1ee;
    --text: var(--midnight);
    --muted: #5f6079;
    --camp: var(--blue);

    --gutter: clamp(16px, 5vw, 56px);
    --measure: 1040px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page);
    color: var(--text);
    font-family: "DM Sans", "Segoe UI", ui-sans-serif, system-ui, -apple-system, Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  .inner { max-width: var(--measure); margin: 0 auto; padding: 0 var(--gutter); }

  /* ── Notice: a slim bar above everything when the page can't refresh ── */
  .notice {
    margin: 0;
    padding: 10px var(--gutter);
    font-size: 14px;
    text-align: center;
  }
  .notice.warn { background: var(--highlighter); color: var(--navy); }
  .notice.gone { background: var(--peach); color: var(--cherry); }

  /* ── Hero: navy ground, the brand field pattern, and the campaign's run ── */
  .hero {
    position: relative;
    overflow: hidden;
    background: var(--navy);
    color: #fff;
    padding: clamp(32px, 6vw, 64px) 0 clamp(28px, 4vw, 40px);
  }
  .field {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(70%, 900px);
    color: var(--violet);
    opacity: 0.4;
    /* Fade the pattern out before it reaches the title. */
    -webkit-mask-image: linear-gradient(to left, #000 35%, transparent 95%);
    mask-image: linear-gradient(to left, #000 35%, transparent 95%);
    pointer-events: none;
  }
  .hero .inner { position: relative; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; padding: 0; list-style: none; }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    line-height: 20px;
  }
  .tag.brand { background: var(--camp); color: #fff; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35); }
  .tag.type { color: var(--violet); box-shadow: inset 0 0 0 1px rgba(183, 179, 255, 0.5); }
  .tag.phase-live { background: var(--highlighter); color: var(--navy); }
  .tag.phase-upcoming { color: #fff; box-shadow: inset 0 0 0 1px #fff; }
  .tag.phase-finished { background: rgba(255, 255, 255, 0.14); color: #fff; }
  .tag.phase-evergreen { background: var(--mint); color: var(--pine); }
  .tag.phase-live::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--navy);
  }

  h1 {
    margin: 0;
    max-width: 22ch;
    font-size: clamp(32px, 5.4vw, 56px);
    line-height: 1.04;
    font-weight: 700;
    letter-spacing: -0.025em;
    text-wrap: balance;
  }
  .owner { margin: 14px 0 0; color: var(--violet); font-size: 15px; }
  .owner strong { color: #fff; font-weight: 600; }
  .desc {
    margin: 18px 0 0;
    max-width: 62ch;
    color: rgba(255, 255, 255, 0.86);
    font-size: 17px;
    line-height: 1.6;
    white-space: pre-wrap;
  }

  /* The run: start to end, filled to today, a diamond per milestone. */
  .run { margin: clamp(36px, 5vw, 52px) 0 0; }
  .run-track {
    position: relative;
    height: 44px;
    margin: 0 8px;
  }
  .run-line {
    position: absolute;
    left: 0;
    right: 0;
    top: 26px;
    height: 4px;
    border-radius: 2px;
    background: rgba(183, 179, 255, 0.28);
  }
  .run-fill {
    position: absolute;
    left: 0;
    top: 26px;
    height: 4px;
    border-radius: 2px;
    background: var(--violet);
    transform-origin: left center;
  }
  .run-fill.intro { animation: grow 900ms cubic-bezier(0.2, 0.7, 0.2, 1) both; }
  @keyframes grow { from { transform: scaleX(0); } }
  .run-ms {
    position: absolute;
    top: 21px;
    width: 14px;
    height: 14px;
    margin-left: -7px;
    transform: rotate(45deg);
    border: 2px solid var(--violet);
    background: var(--navy);
  }
  .run-ms.done { background: var(--mint); border-color: var(--mint); }
  .run-ms.overdue { background: var(--peach); border-color: var(--peach); }
  .run-ms.today,
  .run-ms.next { border-color: var(--highlighter); }
  .run-today {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    margin-left: -1px;
    background: var(--highlighter);
  }
  .run-today span {
    position: absolute;
    top: -6px;
    left: 8px;
    padding: 1px 8px;
    border-radius: 999px;
    background: var(--highlighter);
    color: var(--navy);
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }
  .run-today.flip span { left: auto; right: 8px; }
  .run-ends {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    color: var(--violet);
    font-size: 14px;
  }
  .run-ends strong { display: block; color: #fff; font-weight: 600; font-size: 15px; }
  .run-ends div:last-child { text-align: right; }
  .always {
    margin: clamp(32px, 4vw, 44px) 0 0;
    padding-top: 18px;
    border-top: 1px solid rgba(183, 179, 255, 0.3);
    color: var(--violet);
    font-size: 15px;
  }
  .always strong { color: #fff; font-weight: 600; }

  /* ── Facts: the numbers people come for, as plain type ── */
  .facts {
    background: var(--surface);
    border-bottom: 1px solid var(--rule);
  }
  .facts dl {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    margin: 0;
  }
  .fact { padding: 22px 0; }
  .fact + .fact { padding-left: 24px; border-left: 1px solid var(--rule); }
  .fact dt { color: var(--muted); font-size: 14px; }
  .fact dd { margin: 4px 0 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
  .fact dd small { display: block; margin-top: 2px; color: var(--muted); font-size: 14px; font-weight: 400; letter-spacing: 0; }

  /* ── Milestones: a dated sequence on a rail ── */
  .milestones { padding: clamp(36px, 5vw, 56px) 0 24px; }
  .ms-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  h2 { margin: 0; font-size: 26px; line-height: 1.2; font-weight: 700; letter-spacing: -0.015em; }
  .ms-count { margin: 0; color: var(--muted); font-size: 15px; }
  .ms-count strong { color: var(--text); font-weight: 600; }
  .ms-list { list-style: none; margin: 0; padding: 0; position: relative; }
  .ms-list::before {
    content: "";
    position: absolute;
    z-index: 1;
    left: 11px;
    top: 14px;
    bottom: 14px;
    width: 2px;
    background: var(--rule);
  }
  .ms {
    position: relative;
    display: grid;
    grid-template-columns: 24px 132px minmax(0, 1fr) auto;
    align-items: center;
    gap: 18px;
    padding: 14px 16px 14px 0;
    border-radius: 10px;
  }
  .ms-mark {
    position: relative;
    z-index: 2;
    justify-self: center;
    width: 14px;
    height: 14px;
    transform: rotate(45deg);
    border: 2px solid var(--blue);
    background: var(--page);
  }
  .ms.done .ms-mark { background: var(--pine); border-color: var(--pine); }
  .ms.overdue .ms-mark { background: var(--peach); border-color: var(--cherry); }
  .ms.today .ms-mark,
  .ms.next .ms-mark { background: var(--highlighter); border-color: var(--navy); }
  .ms.next,
  .ms.today { background: rgba(234, 252, 136, 0.45); }
  .ms-date { color: var(--muted); font-size: 15px; }
  .ms-label { font-size: 17px; font-weight: 600; }
  /* The milestone's asset: a live post, a landing page, an EDM. */
  .ms-link {
    display: inline-block;
    margin-left: 12px;
    color: var(--blue);
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid rgba(55, 30, 225, 0.3);
    vertical-align: 1px;
  }
  .ms-link:hover { border-bottom-color: var(--blue); }
  .ms-link:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 2px; }
  .ms.done .ms-label { color: var(--muted); font-weight: 500; }
  .ms-desc { display: block; margin-top: 3px; color: var(--muted); font-size: 15px; font-weight: 400; line-height: 1.45; }
  .ms-status { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .ms.done .ms-status { color: var(--pine); }
  .ms.overdue .ms-status { color: var(--cherry); }
  .ms.today .ms-status,
  .ms.next .ms-status { color: var(--navy); }
  .ms.upcoming .ms-status { color: var(--muted); font-weight: 500; }
  .empty { margin: 0; color: var(--muted); }

  .foot {
    padding: 24px 0 40px;
    color: var(--muted);
    font-size: 13px;
  }
  .foot .live::before {
    content: "";
    display: inline-block;
    width: 7px;
    height: 7px;
    margin-right: 8px;
    border-radius: 50%;
    background: #1f9d5c;
    vertical-align: 1px;
  }

  @media (max-width: 720px) {
    .facts dl { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .fact:nth-child(3) { padding-left: 0; border-left: 0; }
    .fact:nth-child(n + 3) { border-top: 1px solid var(--rule); }
    .ms { grid-template-columns: 24px minmax(0, 1fr); row-gap: 2px; }
    .ms-mark { grid-row: 1 / span 3; align-self: start; margin-top: 6px; }
    .ms-label { grid-column: 2; grid-row: 1; }
    .ms-date { grid-column: 2; grid-row: 2; }
    .ms-status { grid-column: 2; grid-row: 3; }
    .field { width: 100%; opacity: 0.25; }
  }
  @media (prefers-reduced-motion: reduce) {
    .run-fill.intro { animation: none; }
  }
</style>
</head>
<body>
<div id="app">
  <noscript>
    <p class="notice warn">Turn on scripts in your browser to see this campaign.</p>
  </noscript>
</div>
<script type="application/json" id="campaign-snapshot">__CAMPAIGN_SNAPSHOT__</script>
<script>
(function () {
  "use strict";

  // One document holding the campaign as a JSON string in its "json" field.
  var FEED_URL = "__CAMPAIGN_FEED_URL__";
  var REFRESH_MS = 5 * 60 * 1000;
  var DAY_MS = 86400000;

  var PHASE_LABEL = { live: "Live", upcoming: "Upcoming", finished: "Finished", evergreen: "Evergreen" };

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  // Colours arrive from the campaign; only a plain hex is let into a style.
  function safeColor(c) {
    return /^#[0-9a-fA-F]{3,8}$/.test(c || "") ? c : "#371ee1";
  }

  // YYYY-MM-DD in the viewer's own time zone.
  function todayIso() {
    var d = new Date();
    var local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
    return local.toISOString().slice(0, 10);
  }

  function parse(iso) {
    return new Date(iso + "T00:00:00");
  }

  function days(from, to) {
    return Math.round((parse(to).getTime() - parse(from).getTime()) / DAY_MS);
  }

  function fmt(iso, opts) {
    if (!iso) return "—";
    return parse(iso).toLocaleDateString(undefined, opts || { day: "numeric", month: "short", year: "numeric" });
  }

  function fmtDay(iso) {
    return fmt(iso, { weekday: "short", day: "numeric", month: "short" });
  }

  function plural(n, word) {
    return n + " " + word + (n === 1 ? "" : "s");
  }

  function phaseOf(c, today) {
    if (c.evergreen) return "evergreen";
    if (c.endDate < today) return "finished";
    if (c.startDate > today) return "upcoming";
    return "live";
  }

  // `nextId` is the first milestone not yet done from today on, the one
  // row that gets the highlighter. A milestone due today is it.
  function milestoneState(m, today, nextId) {
    if (m.done) return { cls: "done", text: "Done" };
    if (m.date < today) {
      return { cls: "overdue", text: "Overdue by " + plural(days(m.date, today), "day") };
    }
    if (m.date === today) return { cls: m.id === nextId ? "today" : "upcoming", text: "Due today" };
    var n = days(today, m.date);
    var text = n === 1 ? "Tomorrow" : "In " + plural(n, "day");
    if (m.id === nextId) return { cls: "next", text: "Next up, " + text.toLowerCase() };
    return { cls: "upcoming", text: text };
  }

  // A milestone's link, only if it's a plain web address.
  function linkHtml(m) {
    if (!m.url || !/^https?:\/\//i.test(m.url)) return "";
    return ' <a class="ms-link" href="' + esc(m.url) + '" target="_blank" rel="noopener noreferrer">' +
      esc(m.linkText || "Open link") + ' <span aria-hidden="true">↗</span></a>';
  }

  // Where a date falls along the campaign, 0–100, clamped to the ends.
  function pos(iso, c) {
    var span = days(c.startDate, c.endDate);
    if (span <= 0) return 0;
    var p = (days(c.startDate, iso) / span) * 100;
    return Math.max(0, Math.min(100, p));
  }

  // The brand "field": short Violet strokes that turn from upright at the
  // top to flat at the bottom, rows drawing closer as they go down. The
  // same geometry as the brand asset.
  function fieldSvg() {
    var lines = [];
    var y = 50;
    for (var row = 0; row < 20; row++) {
      var hx = 1.5 * row + 0.5;
      var hy = Math.max(0, 21 - 1.1 * row);
      for (var col = 0; col < 19; col++) {
        var x = 50 + 81.2 * col;
        lines.push('<line x1="' + (x - hx).toFixed(1) + '" y1="' + (y + hy).toFixed(1) +
          '" x2="' + (x + hx).toFixed(1) + '" y2="' + (y - hy).toFixed(1) + '"/>');
      }
      y += 82 - 2.55 * row;
    }
    return '<svg class="field" viewBox="0 0 1561 1201" preserveAspectRatio="xMaxYMid slice" aria-hidden="true" focusable="false">' +
      '<g stroke="currentColor" stroke-width="3.2">' + lines.join("") + "</g></svg>";
  }
  var FIELD = fieldSvg();

  // The run only draws itself in the first time the page shows it.
  var introDone = false;

  function render(c, status) {
    var today = todayIso();
    var phase = phaseOf(c, today);
    var ms = (c.milestones || []).slice().sort(function (a, b) {
      return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
    });
    var done = ms.filter(function (m) { return m.done; }).length;
    var overdue = ms.filter(function (m) { return !m.done && m.date < today; }).length;
    var next = ms.filter(function (m) { return !m.done && m.date >= today; })[0];
    var nextId = next ? next.id : null;

    var h = [];

    if (status.kind === "gone") {
      h.push('<p class="notice gone" role="status">This campaign has been removed. These are its details from when the page was last updated.</p>');
    } else if (status.kind === "offline") {
      h.push('<p class="notice warn" role="status">Couldn\'t load the latest details, so these may be out of date. Trying again in a few minutes.</p>');
    }

    // Hero
    h.push('<header class="hero">' + FIELD + '<div class="inner">');
    h.push('<ul class="tags">');
    if (c.brand) h.push('<li class="tag brand">' + esc(c.brand) + "</li>");
    if (c.category) h.push('<li class="tag type">' + esc(c.category) + "</li>");
    h.push('<li class="tag phase-' + phase + '">' + PHASE_LABEL[phase] + "</li>");
    h.push("</ul>");
    h.push("<h1>" + esc(c.name || "Untitled campaign") + "</h1>");
    if (c.owner) h.push('<p class="owner">Run by <strong>' + esc(c.owner) + "</strong></p>");
    if (c.description) h.push('<p class="desc">' + esc(c.description) + "</p>");

    if (phase === "evergreen") {
      h.push('<p class="always"><strong>Always on</strong> ' + (c.startDate > today ? "from " : "since ") +
        esc(fmt(c.startDate)) + ", with no end date.</p>");
    } else {
      var fill = phase === "upcoming" ? 0 : phase === "finished" ? 100 : pos(today, c);
      h.push('<div class="run" aria-hidden="true"><div class="run-track"><div class="run-line"></div>');
      h.push('<div class="run-fill' + (introDone ? "" : " intro") + '" style="width:' + fill + '%"></div>');
      ms.forEach(function (m) {
        var st = milestoneState(m, today, nextId);
        h.push('<div class="run-ms ' + st.cls + '" style="left:' + pos(m.date, c) + '%" title="' +
          esc(m.label + ", " + fmtDay(m.date)) + '"></div>');
      });
      if (phase === "live") {
        var at = pos(today, c);
        h.push('<div class="run-today' + (at > 82 ? " flip" : "") + '" style="left:' + at + '%"><span>Today</span></div>');
      }
      h.push("</div>");
      h.push('<div class="run-ends"><div>Starts<strong>' + esc(fmt(c.startDate)) + "</strong></div>" +
        "<div>Ends<strong>" + esc(fmt(c.endDate)) + "</strong></div></div>");
      h.push("</div>");
    }
    h.push("</div></header>");

    // Facts
    h.push('<section class="facts" aria-label="Campaign timings"><div class="inner"><dl>');
    if (phase === "evergreen") {
      h.push('<div class="fact"><dt>Always on ' + (c.startDate > today ? "from" : "since") + "</dt><dd>" +
        esc(fmt(c.startDate, { day: "numeric", month: "short" })) + "</dd></div>");
    } else {
      var length = days(c.startDate, c.endDate) + 1;
      h.push('<div class="fact"><dt>Runs for</dt><dd>' + plural(length, "day") + "</dd></div>");
      var when =
        phase === "upcoming"
          ? ["Starts in", plural(days(today, c.startDate), "day")]
          : phase === "live"
            ? ["Time left", plural(days(today, c.endDate), "day")]
            : ["Ended", fmt(c.endDate, { day: "numeric", month: "short" })];
      h.push('<div class="fact"><dt>' + when[0] + "</dt><dd>" + esc(when[1]) + "</dd></div>");
    }
    h.push('<div class="fact"><dt>Milestones done</dt><dd>' + (ms.length ? done + " of " + ms.length : "None yet") + "</dd></div>");
    h.push('<div class="fact"><dt>Next up</dt><dd>' +
      (next ? esc(next.label) + "<small>" + esc(fmtDay(next.date)) + "</small>" : "Nothing scheduled") +
      "</dd></div>");
    h.push("</dl></div></section>");

    // Milestones
    h.push('<section class="milestones"><div class="inner">');
    h.push('<div class="ms-head"><h2>Milestones</h2>');
    if (ms.length) {
      h.push('<p class="ms-count"><strong>' + done + " of " + ms.length + "</strong> done" +
        (overdue ? ", " + overdue + " overdue" : "") + "</p>");
    }
    h.push("</div>");
    if (!ms.length) {
      h.push('<p class="empty">No milestones have been added to this campaign yet.</p>');
    } else {
      h.push('<ol class="ms-list">');
      ms.forEach(function (m) {
        var st = milestoneState(m, today, nextId);
        h.push('<li class="ms ' + st.cls + '">' +
          '<span class="ms-mark" aria-hidden="true"></span>' +
          '<span class="ms-date">' + esc(fmtDay(m.date)) + "</span>" +
          '<span class="ms-label">' + esc(m.label) + linkHtml(m) +
            (m.description ? '<span class="ms-desc">' + esc(m.description) + "</span>" : "") + "</span>" +
          '<span class="ms-status">' + esc(st.text) + "</span></li>");
      });
      h.push("</ol>");
    }
    h.push("</div></section>");

    h.push('<footer class="foot"><div class="inner"><span class="' + (status.kind === "live" ? "live" : "") + '">' +
      esc(status.note) + "</span></div></footer>");

    var app = document.getElementById("app");
    app.style.setProperty("--camp", safeColor(c.color));
    app.innerHTML = h.join("");
    document.title = (c.name || "Campaign") + " · Campaign";
    introDone = true;
  }

  function timeNow() {
    return new Date().toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }

  var snapshotEl = document.getElementById("campaign-snapshot");
  // The newest copy of the campaign we have: the snapshot, until a fetch
  // succeeds. Kept on screen when a later fetch fails.
  var latest = JSON.parse(snapshotEl.textContent);

  function asOf() {
    return "Details as of " + new Date(latest.updatedAt).toLocaleString();
  }

  render(latest, { kind: "loading", note: asOf() + ". Checking for updates…" });

  function load() {
    fetch(FEED_URL, { cache: "no-store" })
      .then(function (res) {
        if (res.status === 404) return { gone: true };
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json().then(function (doc) {
          return JSON.parse(doc.fields.json.stringValue);
        });
      })
      .then(function (data) {
        if (data.gone) {
          render(latest, { kind: "gone", note: asOf() });
          return;
        }
        latest = data;
        render(latest, { kind: "live", note: "Live. Updated at " + timeNow() });
      })
      .catch(function () {
        render(latest, { kind: "offline", note: asOf() });
      });
  }

  load();
  setInterval(load, REFRESH_MS);
})();
</script>
</body>
</html>
