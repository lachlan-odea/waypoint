<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>__CAMPAIGN_TITLE__</title>
<style>
  :root {
    --bg: #f6f6fb;
    --surface: #ffffff;
    --surface-2: #f0f0f7;
    --border: #e2e1ee;
    --text: #141e30;
    --muted: #5f6079;
    --primary: #371ee1;
    --done: #1f7a4d;
    --done-bg: #e3f6ea;
    --danger: #c2335f;
    --danger-bg: #fbe9ef;
    --today: #9a5b00;
    --today-bg: #fff3d6;
    --camp: #371ee1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "DM Sans", ui-sans-serif, system-ui, -apple-system, Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 32px 16px 48px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .card-bar { height: 6px; background: var(--camp); }
  .card-body { padding: 20px 24px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
  .chip {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    line-height: 20px;
  }
  .chip.brand { background: var(--camp); color: #fff; }
  .chip.type { border: 1px solid var(--border); color: var(--muted); }
  .chip.phase-live { background: var(--done-bg); color: var(--done); }
  .chip.phase-upcoming { background: var(--surface-2); color: var(--primary); }
  .chip.phase-finished { background: var(--surface-2); color: var(--muted); }
  .chip.phase-evergreen { background: rgba(183, 179, 255, 0.3); color: #1d1765; }
  h1 { font-size: 26px; line-height: 1.25; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0; }
  .desc { margin: 14px 0 0; white-space: pre-wrap; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 12px; }
  .facts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin: 0;
  }
  .fact { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
  .fact dt { font-size: 12px; color: var(--muted); }
  .fact dd { margin: 2px 0 0; font-weight: 600; }

  /* Campaign span with today and each milestone marked along it. */
  .line { position: relative; height: 34px; margin: 18px 6px 4px; }
  .line-track {
    position: absolute; left: 0; right: 0; top: 15px; height: 4px;
    border-radius: 2px; background: var(--surface-2);
  }
  .line-fill { position: absolute; left: 0; top: 15px; height: 4px; border-radius: 2px; background: var(--camp); }
  .line-ms {
    position: absolute; top: 11px; width: 12px; height: 12px; margin-left: -6px;
    transform: rotate(45deg); border: 2px solid var(--camp); background: var(--surface);
  }
  .line-ms.done { background: var(--camp); }
  .line-ms.overdue { border-color: var(--danger); }
  .line-today { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--text); }
  .line-today span {
    position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
    font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  .line-ends { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }

  .progress-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .progress { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; margin: 6px 0 16px; }
  .progress div { height: 100%; background: var(--done); }
  .ms { list-style: none; margin: 0; padding: 0; }
  .ms li {
    display: grid;
    grid-template-columns: 22px 150px 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 10px 0;
    border-top: 1px solid var(--border);
  }
  .ms li:first-child { border-top: 0; }
  .ms-mark {
    width: 20px; height: 20px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; border: 2px solid var(--border); color: var(--muted);
  }
  .ms li.done .ms-mark { background: var(--done); border-color: var(--done); color: #fff; }
  .ms li.overdue .ms-mark { border-color: var(--danger); color: var(--danger); }
  .ms li.today .ms-mark { border-color: var(--today); color: var(--today); }
  .ms-date { color: var(--muted); font-size: 14px; }
  .ms-label { font-weight: 600; }
  .ms li.done .ms-label { color: var(--muted); }
  .ms-status { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .ms li.done .ms-status { background: var(--done-bg); color: var(--done); }
  .ms li.overdue .ms-status { background: var(--danger-bg); color: var(--danger); }
  .ms li.today .ms-status { background: var(--today-bg); color: var(--today); }
  .ms li.upcoming .ms-status { background: var(--surface-2); color: var(--muted); }
  .empty { color: var(--muted); margin: 0; }

  .notice { border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: 14px; }
  .notice.warn { background: var(--today-bg); color: var(--today); }
  .notice.gone { background: var(--danger-bg); color: var(--danger); }
  .foot { color: var(--muted); font-size: 12px; text-align: center; }

  @media (max-width: 560px) {
    .card-body { padding: 16px; }
    h1 { font-size: 22px; }
    .ms li { grid-template-columns: 22px 1fr; row-gap: 2px; }
    .ms-date { grid-column: 2; grid-row: 2; }
    .ms-label { grid-column: 2; grid-row: 1; }
    .ms-status { grid-column: 2; grid-row: 3; justify-self: start; }
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <noscript>
    <p class="notice warn">This page needs scripts enabled to show the campaign.</p>
  </noscript>
</div>
<script type="application/json" id="campaign-snapshot">__CAMPAIGN_SNAPSHOT__</script>
<script>
(function () {
  "use strict";

  var FEED_URL = "__CAMPAIGN_FEED_URL__";
  var TOKEN = "__CAMPAIGN_TOKEN__";
  var REFRESH_MS = 5 * 60 * 1000;
  var DAY_MS = 86400000;

  var PHASE_LABEL = { live: "Live", upcoming: "Upcoming", finished: "Finished", evergreen: "Evergreen" };

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  // Colours arrive from Firestore; only a plain hex is let into a style.
  function safeColor(c) {
    return /^#[0-9a-fA-F]{3,8}$/.test(c || "") ? c : "#371ee1";
  }

  // YYYY-MM-DD in the viewer's own time zone.
  function todayIso() {
    var d = new Date();
    var local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
    return local.toISOString().slice(0, 10);
  }

  function parse(iso) {
    return new Date(iso + "T00:00:00");
  }

  function days(from, to) {
    return Math.round((parse(to).getTime() - parse(from).getTime()) / DAY_MS);
  }

  function fmt(iso, withWeekday) {
    if (!iso) return "—";
    var opts = { day: "numeric", month: "short", year: "numeric" };
    if (withWeekday) opts.weekday = "short";
    return parse(iso).toLocaleDateString(undefined, opts);
  }

  function plural(n, word) {
    return n + " " + word + (n === 1 ? "" : "s");
  }

  function phaseOf(c, today) {
    if (c.evergreen) return "evergreen";
    if (c.endDate < today) return "finished";
    if (c.startDate > today) return "upcoming";
    return "live";
  }

  function milestoneState(m, today) {
    if (m.done) return { cls: "done", mark: "✓", text: "Completed" };
    if (m.date < today) return { cls: "overdue", mark: "!", text: "Overdue" };
    if (m.date === today) return { cls: "today", mark: "•", text: "Due today" };
    var n = days(today, m.date);
    return { cls: "upcoming", mark: "", text: "In " + plural(n, "day") };
  }

  // Where a date falls along the campaign, 0–100, clamped to the ends.
  function pos(iso, c) {
    var span = days(c.startDate, c.endDate);
    if (span <= 0) return 0;
    var p = (days(c.startDate, iso) / span) * 100;
    return Math.max(0, Math.min(100, p));
  }

  function render(c, status) {
    var today = todayIso();
    var color = safeColor(c.color);
    var phase = phaseOf(c, today);
    var length = days(c.startDate, c.endDate) + 1;
    var ms = (c.milestones || []).slice().sort(function (a, b) {
      return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
    });
    var done = ms.filter(function (m) { return m.done; }).length;
    var overdue = ms.filter(function (m) { return !m.done && m.date < today; }).length;

    var phaseNote =
      phase === "upcoming"
        ? "Starts in " + plural(days(today, c.startDate), "day")
        : phase === "live"
          ? plural(days(today, c.endDate), "day") + " left"
          : "Ended " + fmt(c.endDate);

    var h = [];

    if (status.kind === "gone") {
      h.push('<p class="notice gone">This campaign has been removed. Showing the details as they were when this page was made.</p>');
    } else if (status.kind === "offline") {
      h.push('<p class="notice warn">Couldn\'t load the latest details, so this may be out of date. It will try again shortly.</p>');
    }

    // Header
    h.push('<section class="card"><div class="card-bar"></div><div class="card-body">');
    h.push('<div class="chips">');
    if (c.brand) h.push('<span class="chip brand">' + esc(c.brand) + "</span>");
    if (c.category) h.push('<span class="chip type">' + esc(c.category) + "</span>");
    h.push('<span class="chip phase-' + phase + '">' + PHASE_LABEL[phase] + "</span>");
    h.push("</div>");
    h.push("<h1>" + esc(c.name || "Untitled campaign") + "</h1>");
    h.push('<p class="sub">' +
      (phase === "evergreen" ? "Always on" : esc(fmt(c.startDate)) + " – " + esc(fmt(c.endDate))) +
      (c.owner ? " · Owner: " + esc(c.owner) : "") + "</p>");
    if (c.description) h.push('<p class="desc">' + esc(c.description) + "</p>");
    h.push("</div></section>");

    // Timings. An evergreen campaign has no run to lay out.
    if (phase === "evergreen") {
      h.push('<section class="card"><div class="card-body"><h2>Timings</h2><dl class="facts">');
      h.push('<div class="fact"><dt>Status</dt><dd>Always on, with no start or end date</dd></div>');
      h.push("</dl></div></section>");
    } else {
      h.push('<section class="card"><div class="card-body"><h2>Timings</h2><dl class="facts">');
      h.push('<div class="fact"><dt>Starts</dt><dd>' + esc(fmt(c.startDate, true)) + "</dd></div>");
      h.push('<div class="fact"><dt>Ends</dt><dd>' + esc(fmt(c.endDate, true)) + "</dd></div>");
      h.push('<div class="fact"><dt>Duration</dt><dd>' + plural(length, "day") + "</dd></div>");
      h.push('<div class="fact"><dt>Status</dt><dd>' + esc(phaseNote) + "</dd></div>");
      h.push("</dl>");
      h.push('<div class="line" aria-hidden="true"><div class="line-track"></div>');
      h.push('<div class="line-fill" style="width:' +
        (phase === "upcoming" ? 0 : phase === "finished" ? 100 : pos(today, c)) + '%"></div>');
      ms.forEach(function (m) {
        var st = milestoneState(m, today);
        h.push('<div class="line-ms ' + st.cls + '" style="left:' + pos(m.date, c) + '%" title="' +
          esc(m.label + " · " + fmt(m.date)) + '"></div>');
      });
      if (phase === "live") {
        h.push('<div class="line-today" style="left:' + pos(today, c) + '%"><span>Today</span></div>');
    }
    h.push('</div><div class="line-ends"><span>' + esc(fmt(c.startDate)) + "</span><span>" +
      esc(fmt(c.endDate)) + "</span></div>");
    h.push("</div></section>");
    }

    // Milestones
    h.push('<section class="card"><div class="card-body">');
    h.push('<div class="progress-head"><h2>Milestones</h2>');
    if (ms.length) {
      h.push('<span class="sub">' + done + " of " + ms.length + " completed" +
        (overdue ? " · " + overdue + " overdue" : "") + "</span>");
    }
    h.push("</div>");
    if (!ms.length) {
      h.push('<p class="empty">No milestones yet.</p>');
    } else {
      h.push('<div class="progress"><div style="width:' + (done / ms.length) * 100 + '%"></div></div>');
      h.push('<ul class="ms">');
      ms.forEach(function (m) {
        var st = milestoneState(m, today);
        h.push('<li class="' + st.cls + '">' +
          '<span class="ms-mark" aria-hidden="true">' + st.mark + "</span>" +
          '<span class="ms-date">' + esc(fmt(m.date, true)) + "</span>" +
          '<span class="ms-label">' + esc(m.label) + "</span>" +
          '<span class="ms-status">' + esc(st.text) + "</span></li>");
      });
      h.push("</ul>");
    }
    h.push("</div></section>");

    h.push('<p class="foot">' + esc(status.note) + "</p>");

    var app = document.getElementById("app");
    app.style.setProperty("--camp", color);
    app.innerHTML = h.join("");
    document.title = (c.name || "Campaign") + " · Campaign";
  }

  function timeNow() {
    return new Date().toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }

  var snapshotEl = document.getElementById("campaign-snapshot");
  // The newest copy of the campaign we have: the snapshot, until a fetch
  // succeeds. Kept on screen when a later fetch fails.
  var latest = JSON.parse(snapshotEl.textContent);

  function asOf() {
    return "Details as of " + new Date(latest.fetchedAt).toLocaleString();
  }

  render(latest, { kind: "loading", note: asOf() + " · checking for updates…" });

  function load() {
    var url = FEED_URL + "?token=" + encodeURIComponent(TOKEN);
    fetch(url, { cache: "no-store" })
      .then(function (res) {
        if (res.status === 404) return { gone: true };
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) {
        if (data.gone) {
          render(latest, { kind: "gone", note: asOf() });
          return;
        }
        latest = data;
        render(latest, { kind: "live", note: "Updated " + timeNow() });
      })
      .catch(function () {
        render(latest, { kind: "offline", note: asOf() });
      });
  }

  load();
  setInterval(load, REFRESH_MS);
})();
</script>
</body>
</html>
